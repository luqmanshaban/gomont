{{define "extra_css"}}<link rel="stylesheet" href="/static/css/auth.css" />{{end}}

{{define "body"}}
<div class="auth-shell">
  <a href="/" class="auth-back">&larr; Back</a>

  <div class="auth-card-wrap">
    <div class="auth-card-frame"></div>

    <svg class="auth-doodle d2" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="30" stroke="currentColor" stroke-width="4" stroke-dasharray="6,10" />
    </svg>

    <div class="auth-card panel">
      <div class="eyebrow">Get started</div>

      <!-- Step 1: email -->
      <div id="email-step">
        <h1 class="auth-heading">Access your account</h1>
        <p class="auth-sub">Enter your email and we'll send a one-time code to confirm it's you. No password to remember.</p>

        <form id="email-form" novalidate>
          <div class="field" id="email-field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send code</button>
        </form>
      </div>

      <!-- Step 2: code -->
      <div id="code-step" hidden>
        <h1 class="auth-heading">Confirm your email</h1>
        <p class="auth-sub">We sent a 6-digit code to <strong id="code-email-label"></strong></p>

        <form id="code-form" novalidate>
          <div class="field" id="code-field">
            <label for="code">Verification code</label>
            <input type="text" id="code" name="code" class="otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="------" autocomplete="one-time-code" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="auth-switch">
          Didn't get it? <a href="#" id="resend-code">Resend code</a>
        </p>
      </div>

      <!--<p class="auth-switch">
        Already have an account? <a href="/login">Log in</a>
      </p>-->
    </div>
  </div>
</div>
{{end}}

{{define "extra_js"}}
<script src="/static/js/auth.js"></script>
<script>
  // Signup: POST /auth sends the code, POST /auth/login verifies it.
  GomontAuth.initAuthFlow({ requestEndpoint: "/auth", verifyEndpoint: "/auth/login" });
</script>
{{end}}
