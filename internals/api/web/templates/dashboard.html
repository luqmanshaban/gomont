{{define "extra_css"}}<link rel="stylesheet" href="/static/css/dashboard.css" />{{end}}

{{define "body"}}
<div class="shell">
  {{template "navbar" .}}

  <main>
    <div class="container">
      <div class="page-head">
        <div>
          <h1>Monitors</h1>
          <p class="page-sub">Every endpoint you're watching, checked on its own schedule.</p>
        </div>
      </div>

      <!-- Add monitor -->
      <section class="panel add-monitor-panel">
        <div class="eyebrow">Add a monitor</div>
        <form id="add-monitor-form" class="add-monitor-form" novalidate>
          <div class="field" id="endpoint-field">
            <label for="endpoint">URL to watch</label>
            <input type="url" id="endpoint" name="endpoint" placeholder="https://api.example.com/health" required />
          </div>
          <div class="field" id="interval-field">
            <label for="interval">Check every (min)</label>
            <input type="number" id="interval" name="interval" min="1" value="5" required />
          </div>
          <button type="submit" class="btn btn-accent">Add monitor</button>
        </form>
      </section>

      <!-- Monitor list -->
      <section class="panel monitor-list-panel">
        <div class="monitor-list-head">
          <div class="eyebrow" style="margin-bottom:0">Watching</div>
          <span class="monitor-count" id="monitor-count"></span>
        </div>

        <div id="monitor-list">
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
          <div class="skeleton-row"></div>
        </div>
      </section>
    </div>
  </main>
</div>
{{end}}

{{define "extra_js"}}
<script src="/static/js/app.js"></script>
<script src="/static/js/dashboard.js"></script>
{{end}}
