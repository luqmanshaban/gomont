{{define "extra_css"}}<link rel="stylesheet" href="/static/css/auth.css" />{{end}}

{{define "body"}}
<div class="auth-shell">
  <a href="/" class="auth-back">&larr; Back</a>

  <div class="auth-card-wrap">
    <div class="auth-card-frame"></div>

    <svg class="auth-doodle d1" viewBox="0 0 100 100" fill="none">
      <path d="M 10 50 Q 30 20, 50 50 T 90 50" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,8" />
    </svg>

    <div class="auth-card panel">
      <div class="eyebrow">Welcome back</div>

      <!-- Step 1: email -->
      <div id="email-step">
        <h1 class="auth-heading">Log in</h1>
        <p class="auth-sub">Enter your email and we'll send a one-time code. No password needed.</p>

        <form id="email-form" novalidate>
          <div class="field" id="email-field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send code</button>
        </form>
      </div>

      <!-- Step 2: code -->
      <div id="code-step" hidden>
        <h1 class="auth-heading">Enter your code</h1>
        <p class="auth-sub">We sent a 6-digit code to <strong id="code-email-label"></strong></p>

        <form id="code-form" novalidate>
          <div class="field" id="code-field">
            <label for="code">Verification code</label>
            <input type="text" id="code" name="code" class="otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="------" autocomplete="one-time-code" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log in</button>
        </form>
        <p class="auth-switch">
          Didn't get it? <a href="#" id="resend-code">Resend code</a>
        </p>
      </div>

      <p class="auth-switch">
        Don't have an account? <a href="/signup">Sign up</a>
      </p>
    </div>
  </div>
</div>
{{end}}

{{define "extra_js"}}
<script src="/static/js/auth.js"></script>
<script>
  // Login overloads /auth/login: {email} sends the code, {email, code} verifies it.
  GomontAuth.initAuthFlow({ requestEndpoint: "/auth/login", verifyEndpoint: "/auth/login" });
</script>
{{end}}
